name: PR

# Does it build? That is the whole job. This runs the same `stcmd make`
# as release.yml, so a pull request that would break the release fails
# here instead, and it tags nothing, publishes nothing and keeps no
# artifacts. There is no host test suite in this port: verification is a
# build plus a run under Hatari, and a runner cannot do the second half.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only: this workflow runs code from a contributor's branch, so it
# gets nothing it does not need. release.yml holds the write token.
permissions:
  contents: read

# A force-push mid-review should not leave two builds racing to report.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # stcmd runs docker with -it unless this is set, and a runner has no
  # terminal.
  STCMD_NO_TTY: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          # STDL is a submodule and carries Xpad as a submodule of its
          # own, which the Makefile names in STDL_SRCS. Recursing is
          # required for the link to succeed, not a convenience.
          submodules: recursive

      - name: Install the Atari ST toolkit
        # Generates /usr/local/bin/stcmd, which runs the m68k build in a
        # container. The installer picks the image for the runner's
        # architecture, so this is the x86_64 image here and an arm64 one
        # on a developer's Mac; both carry m68k-atari-mint-g++.
        # The installer comes through GitHub's API (gh), with the plain
        # download as the fallback, to a file and then run: on
        # 2026-11-08 the plain download answered with error pages for
        # over an hour while the API served the file, and piped to bash,
        # an error page went in as a script (STDL's and Koules' releases
        # failed on it).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R sidecartridge/atarist-toolkit-docker \
              -p install_atarist_toolkit_docker.sh -D "$RUNNER_TEMP" \
            || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
              -o "$RUNNER_TEMP/install_atarist_toolkit_docker.sh" \
              https://github.com/sidecartridge/atarist-toolkit-docker/releases/latest/download/install_atarist_toolkit_docker.sh
          bash "$RUNNER_TEMP/install_atarist_toolkit_docker.sh"

      - name: Build
        # The command the README documents, unchanged: libstdl.a and the
        # dist/FLASHBAK.TOS that links against it. Then the TT and Falcon
        # build, dist/FBACK030.TOS, which release.yml publishes beside it.
        run: |
          stcmd make
          stcmd make 030
