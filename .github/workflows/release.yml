name: Release

# Rolling release: build, tag the commit with the next
# v<version>-atarist.N, move the lightweight "latest" tag onto it, and
# replace the files on the "latest" release. The release's title and
# body are left exactly as they are -- `gh release upload` touches
# assets only -- and the asset names never change, so a download link
# handed to someone keeps working.

on:
  # Anything landing on main is a release: a merge, or a direct push.
  # Tag pushes do not match a branch filter, so the tags this workflow
  # creates cannot trigger it again.
  push:
    branches:
      - main
    # A prose-only push cannot change the binary, and this repository
    # writes a lot of prose; cutting an -atarist.N for a typo fix would
    # be noise. GitHub still runs the job when a push touches anything
    # else as well, and workflow_dispatch forces one by hand.
    paths-ignore:
      - '**.md'
      - 'CHANGES.txt'
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession would otherwise race: both move the
# latest tag and clobber the same assets, and the loser would decide
# what the release ends up holding. Newest commit wins instead.
concurrency:
  group: release
  cancel-in-progress: true

env:
  STCMD_NO_TTY: 1

jobs:
  release:
    runs-on: ubuntu-latest
    # The push trigger already filters to main; this is what stops a
    # manual dispatch from some other branch tagging and releasing it.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # The next version number is counted from the tags already in
          # the repository, and checkout fetches none of them without a
          # full clone.
          fetch-depth: 0

      - name: Install the Atari ST toolkit
        run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/latest/download/install_atarist_toolkit_docker.sh | bash

      - name: Build
        # The Makefile drops RS.CFG.template in beside the binary as
        # RS.CFG, so both release files come out of this one command.
        run: stcmd make

      - name: Work out the version and tag it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag already sitting on this commit is the maintainer's own:
          # the notes for -atarist.1 and .2 are hand-written annotated
          # tag messages, and a release worth writing notes for gets
          # tagged by hand before the merge. Release what it names
          # rather than adding a second number for the same commit.
          VERSION=$(git tag --points-at HEAD --list 'v*-atarist.*' | sort -V | tail -1)

          if [ -n "$VERSION" ]; then
            echo "This commit is already tagged $VERSION; leaving it alone."
          else
            PREVIOUS=$(git tag --list 'v*-atarist.*' | sort -V | tail -1)
            # Refuse to invent a base version out of nothing: if the tags
            # have gone missing, the fix is to restore them, not to start
            # counting again from a number this job guessed.
            test -n "$PREVIOUS" || { echo "No v*-atarist.* tag to count from."; exit 1; }
            VERSION="${PREVIOUS%-atarist.*}-atarist.$(( ${PREVIOUS##*-atarist.} + 1 ))"

            # Through the API rather than `git push`: pushing a tag is
            # refused when the commit it points at touches
            # .github/workflows and the token has no workflow scope,
            # which is exactly the commit that adds these files.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" --silent
            echo "Tagged $VERSION."
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Move the latest tag onto this commit
        # The "latest" release is attached to this tag, so moving it
        # keeps the release's source link pointing at the commit the
        # attached binary was actually built from. PATCH first because
        # the tag already exists; POST covers a repository where it does
        # not yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
            -f sha="$GITHUB_SHA" -F force=true --silent \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref=refs/tags/latest -f sha="$GITHUB_SHA" --silent

      - name: Bundle the data and music tools
        # A tester extracted their disks with the hand-built tools.zip
        # from an earlier release, which went stale the moment the
        # scripts changed underneath it. Building it here means it can
        # only ever be the tools that shipped beside this binary.
        #
        # stdlconv comes from the STDL submodule, already present from
        # the recursive checkout, and make-music.sh finds it by a path
        # relative to its own directory - so the two keep their repo
        # layout inside the zip rather than being flattened.
        #
        # The splash tooling is deliberately absent: it has nothing to
        # do with data or music, and tools/README.md - which is in the
        # zip - documents exactly this set and no more.
        run: |
          zip -q -X tools.zip \
            tools/README.md \
            tools/check-names.sh \
            tools/extract-data.sh \
            tools/ipf2adf.c \
            tools/make-music.sh \
            tools/mod2smf.py \
            stdl/tools/stdlconv/stdlconv.py
          unzip -l tools.zip

      - name: Replace the files on the latest release
        # The binary, its documented config, and the tools to get the
        # data out of your own disks. DATA/ itself comes from the
        # player's Amiga disks and is never published here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Flashback" --notes "Rolling build of the Atari ST port."
          gh release upload latest dist/FLASHBAK.TOS dist/RS.CFG tools.zip --clobber
          echo "Published $VERSION to the latest release."
